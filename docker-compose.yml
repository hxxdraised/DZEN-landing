services:
  postgres:
    image: postgres:17-alpine
    container_name: dzen-postgres
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dzen} -d ${POSTGRES_DB:-dzen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dzen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.local
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dzen-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-changeme}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    container_name: dzen-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/${S3_BUCKET:-dzen} &&
      mc anonymous set download local/${S3_BUCKET:-dzen} &&
      echo 'minio bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dzen-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-changeme}

volumes:
  postgres_data:
  minio_data:
