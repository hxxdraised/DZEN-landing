name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dzen
          POSTGRES_PASSWORD: dzen_ci
          POSTGRES_DB: dzen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dzen -d dzen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgres://dzen:dzen_ci@localhost:5432/dzen
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Seed build database
        run: node scripts/seed.mjs
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_YANDEX_METRICA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRICA_ID }}

      - name: Stage release
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp deploy/ecosystem.config.cjs .next/standalone/ecosystem.config.cjs
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /opt/dzen/releases

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            RELEASE_DIR="/opt/dzen/releases/${{ github.sha }}"
            mkdir -p "$RELEASE_DIR"
            tar -xzf /opt/dzen/releases/release.tar.gz -C "$RELEASE_DIR"
            rm -f /opt/dzen/releases/release.tar.gz
            ln -sfn "$RELEASE_DIR" /opt/dzen/current
            pm2 startOrReload /opt/dzen/current/ecosystem.config.cjs --update-env
            sleep 5
            if ! curl -sf http://127.0.0.1:3000/ > /dev/null; then
              pm2 logs dzen --lines 30 --nostream || true
              echo "Healthcheck failed"
              exit 1
            fi
            ls -1dt /opt/dzen/releases/*/ | tail -n +6 | xargs -r rm -rf
            echo "Deploy OK: ${{ github.sha }}"
