services:
  postgres:
    image: postgres:17-alpine
    container_name: dzen-postgres
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dzen} -d ${POSTGRES_DB:-dzen}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
